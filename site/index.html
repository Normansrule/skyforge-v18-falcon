<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYFORGE Falcon Workbench</title>
<meta name="description" content="Build workbench for the SKYFORGE V18 Falcon hybrid-VTOL and its V19 directions: 3D model, balance, budget, bench data, wiring and build stages.">
<meta name="theme-color" content="#1B232C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<header class="bar">
  <a class="brand" href="#aircraft" aria-label="SKYFORGE Falcon home">
    <img src="icons/mark.svg" alt="" width="30" height="30">
    <span class="brand-name">SKYFORGE <b>Falcon</b></span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="#aircraft" data-tab="aircraft">Aircraft</a>
    <a href="#v19" data-tab="v19">V19</a>
    <a href="#balance" data-tab="balance">Balance</a>
    <a href="#budget" data-tab="budget">Budget</a>
    <a href="#bom" data-tab="bom">Parts</a>
    <a href="#bench" data-tab="bench">Bench</a>
    <a href="#wiring" data-tab="wiring">Wiring</a>
    <a href="#stages" data-tab="stages">Stages</a>
    <a href="#docs" data-tab="docs">Docs</a>
  </nav>
  <span class="status-pill" id="status-pill" title="Model gate status">loading…</span>
</header>

<main id="app">
  <section class="workbench" id="workbench">
    <div class="viewport" id="viewport">
      <canvas id="three" aria-label="3D model. Drag to orbit, scroll to zoom, click a part to inspect it."></canvas>
      <div class="load" aria-hidden="true"><div class="load-mark"></div><div class="load-bar" id="load-bar"></div></div>
      <div class="variant-pills" id="variant-pills" role="group" aria-label="Design variant"></div>
      <div class="viewport-hint" id="viewport-hint">Drag to orbit · scroll to zoom · click a part</div>
      <div class="ruler" id="ruler" aria-label="Fore-aft balance ruler"></div>
      <div class="hud" id="hud" aria-hidden="true">
        <svg viewBox="-200 -120 400 240" preserveAspectRatio="xMidYMid meet">
          <g class="ladder"><line x1="-120" x2="-40" y1="0" y2="0"/><line x1="40" x2="120" y1="0" y2="0"/>
            <line x1="-60" x2="-30" y1="-48" y2="-48"/><line x1="30" x2="60" y1="-48" y2="-48"/><text x="66" y="-44">10</text>
            <line x1="-60" x2="-30" y1="48" y2="48" stroke-dasharray="6 5"/><line x1="30" x2="60" y1="48" y2="48" stroke-dasharray="6 5"/><text x="66" y="52">-10</text></g>
          <path class="wings" d="M-34,8 L-14,8 L-7,16 L0,8 L7,16 L14,8 L34,8"/>
          <circle class="wings" cx="0" cy="0" r="2.5"/>
        </svg>
        <div class="hud-cap"></div>
        <div class="hud-tip">Drag to look around · pick another view to leave the seat</div>
      </div>
      <div class="intro" id="intro" hidden></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </section>
  <section class="page" id="page" hidden></section>
</main>

<noscript><p class="noscript">This workbench needs JavaScript. The same content is in the repository's docs folder.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
