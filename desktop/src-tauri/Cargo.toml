[package]
name = "skyforge-v18"
version = "0.6.0"
description = "SKYFORGE V18 Falcon build workbench (desktop shell around site/)"
authors = ["Aleksander Norman"]
edition = "2021"

[lib]
name = "skyforge_v18_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
